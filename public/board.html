<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한울타리 자체전 포메이션 보드</title>
<meta name="description" content="한울타리 FC 자체전 — 포지션 입력, 팀 구성, 포메이션 보드.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=17">
<link rel="stylesheet" href="/board.css?v=5">
</head>
<body class="board">

<header class="b-bar">
  <div class="b-title"><small>한울타리 FC</small><b>자체전 포메이션 보드</b></div>
  <span id="phase" class="b-chip">불러오는 중</span>
</header>

<nav class="b-tabs" role="tablist" aria-label="보드 메뉴">
  <button type="button" role="tab" data-tab="pos" class="on">① 내 포지션</button>
  <button type="button" role="tab" data-tab="draft">② 팀 구성</button>
  <button type="button" role="tab" data-tab="form">③ 포메이션</button>
</nav>

<main class="b-main" id="main">
  <p id="loadErr" class="err" hidden></p>
  <section id="pane-pos"   class="b-pane on" role="tabpanel"></section>
  <section id="pane-draft" class="b-pane"    role="tabpanel"></section>
  <section id="pane-form"  class="b-pane"    role="tabpanel"></section>
  <div class="b-foot">
    <span id="modeTag" class="b-mode" hidden></span>
    <button type="button" id="adminBtn" class="b-link">총무</button>
    <span>·</span>
    <a class="b-link" href="/">유니폼 투표로</a>
  </div>
</main>

<div id="toast" class="b-toast" hidden></div>

<!-- 포지션 고르기 -->
<div id="posSheet" class="sheet" hidden>
  <div class="sheetbox b-sheetbox" role="dialog" aria-modal="true" aria-labelledby="psTitle">
    <h3 id="psTitle"></h3>
    <p id="psHelp">뛸 수 있는 자리를 1~3개 골라주세요. <b>먼저 누른 것이 주 포지션</b>입니다.</p>
    <div id="psGrid" class="b-posgrid"></div>
    <div id="psAuth" class="b-authrow" hidden>
      <label for="psCode">본인 확인 · 전화번호 뒷 4자리</label>
      <input id="psCode" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000">
    </div>
    <p id="psErr" class="err" hidden></p>
    <button type="button" id="psSave" class="primary">저장</button>
    <button type="button" id="psForce" class="ghost" hidden>번호가 달라도 그대로 저장</button>
    <div id="psAdmin" class="b-adminrow" hidden>
      <button type="button" id="psToggle" class="b-mini"></button>
      <button type="button" id="psClear" class="b-mini">포지션 지우기</button>
    </div>
    <button type="button" id="psClose" class="plainlink">닫기</button>
  </div>
</div>

<!-- 감독 로그인 -->
<div id="coachSheet" class="sheet" hidden>
  <div class="sheetbox b-sheetbox" role="dialog" aria-modal="true" aria-labelledby="csTitle">
    <h3 id="csTitle">감독 모드</h3>
    <p>감독 모드에서는 일요일에 선수를 고르고, 최종 확정하고, 포메이션을 짤 수 있습니다. 본인 확인이 필요합니다.</p>
    <div id="csWho" class="b-who"></div>
    <div class="b-authrow">
      <label for="csCode">전화번호 뒷 4자리</label>
      <input id="csCode" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000">
    </div>
    <p id="csErr" class="err" hidden></p>
    <button type="button" id="csGo" class="primary">확인</button>
    <button type="button" id="csClose" class="plainlink">닫기</button>
  </div>
</div>

<!-- 총무 -->
<div id="adminSheet" class="sheet" hidden>
  <div class="sheetbox b-sheetbox b-tall" role="dialog" aria-modal="true" aria-labelledby="asTitle">
    <h3 id="asTitle">총무</h3>
    <div id="asBody"></div>
    <button type="button" id="asClose" class="plainlink">닫기</button>
  </div>
</div>

<script src="/core.js?v=3"></script>
<script src="/board.js?v=6"></script>
</body>
</html>
