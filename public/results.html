<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>관리자 — 유니폼 투표</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#15181d;--mute:#6b7280;--line:#e5e7eb;--bg:#f1f3f5;--win:#0f8a4d;--warn:#c2410c}
body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;padding:24px 16px calc(60px + env(safe-area-inset-bottom))}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:26px;font-weight:900;letter-spacing:-.02em}
p.sub{color:var(--mute);font-size:14px;line-height:1.6;margin:6px 0 22px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

.gate{background:#fff;border:2px solid var(--line);border-radius:16px;padding:22px}
.gate label{display:block;font-size:15px;font-weight:700;margin-bottom:10px}
.gate input{width:150px;font:inherit;font-size:26px;font-weight:700;letter-spacing:.3em;
  text-align:center;padding:13px 8px 13px 20px;border:2px solid var(--line);border-radius:12px}
.gate input:focus{outline:none;border-color:var(--ink)}
.gate button{margin-left:10px;padding:16px 26px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700}
.err{color:var(--warn);font-weight:700;font-size:15px;margin-top:12px}
.err[hidden]{display:none}

.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
.card h2{font-size:17px;font-weight:900;margin-bottom:8px}
.card p{font-size:14px;color:var(--mute);line-height:1.65}
code{background:var(--bg);padding:3px 7px;border-radius:6px;font-size:14px;word-break:break-all}

table{width:100%;border-collapse:collapse;font-size:15px;background:#fff;border-radius:14px;overflow:hidden}
th,td{padding:12px 10px;text-align:left;border-bottom:1px solid #eef0f3}
th{font-size:12px;color:var(--mute);font-weight:700;white-space:nowrap;background:#fafbfc}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.top td{background:#f6fbf8}
tr.top td:first-child{font-weight:900}
.rank{width:34px;color:var(--mute);font-weight:700}
.win{display:inline-block;min-width:22px;padding:1px 7px;border-radius:99px;background:var(--win);
  color:#fff;font-size:13px;font-weight:700;text-align:center}
.sm{color:var(--mute);font-size:13px}

.del{padding:7px 13px;border:2px solid var(--line);border-radius:9px;font-size:13px;font-weight:700;color:var(--warn);background:#fff}
.danger{border:2px solid #f3c7ae;background:#fff8f4}
.danger h2{color:var(--warn)}
.danger input{font:inherit;font-size:16px;padding:11px 13px;border:2px solid var(--line);border-radius:10px;width:190px}
.danger button{padding:12px 20px;border-radius:10px;background:var(--warn);color:#fff;font-weight:700}
.danger button:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.row input[type=datetime-local]{font:inherit;font-size:16px;padding:11px 13px;border:2px solid var(--line);border-radius:10px}
.save{padding:12px 22px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.bar button{padding:10px 16px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:14px;font-weight:700}
.ok{color:var(--win);font-weight:700;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>관리자</h1>
  <p class="sub">2027 유니폼 투표 · 집계와 정리</p>

  <div class="gate" id="gate">
    <label for="k">비밀번호</label>
    <input id="k" type="password" inputmode="numeric" autocomplete="off" placeholder="····">
    <button id="enter">들어가기</button>
    <p class="err" id="gateErr" hidden></p>
  </div>

  <div id="out" hidden></div>
</div>

<script>
const $ = id => document.getElementById(id);
const won = n => Number(n).toLocaleString();
let KEY = '';

async function api(path, opts) {
  const sep = path.includes('?') ? '&' : '?';
  const r = await fetch(path + sep + 'key=' + encodeURIComponent(KEY), opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || '요청이 실패했습니다.');
  return j;
}

async function enter() {
  KEY = $('k').value.trim();
  if (!KEY) return;
  try {
    await load();
    sessionStorage.setItem('kitKey', KEY);
    $('gate').hidden = true;
    $('out').hidden = false;
  } catch (e) {
    sessionStorage.removeItem('kitKey');
    $('gateErr').textContent = e.message;
    $('gateErr').hidden = false;
  }
}

async function load() {
  const j = await api('/api/results');
  const pts = Object.values(j.points);
  const bad = j.voters.filter(v => v.codeOk === false);

  const rows = j.ranking.map((k, i) => `
    <tr class="${i < 5 ? 'top' : ''}">
      <td class="rank">${i + 1}</td>
      <td>${k.name}<br><span class="sm">${k.vendor} · ${won(k.price)}원 · ${k.family}</span></td>
      <td class="n">${k.score}</td>
      <td class="n">${k.first ? `<span class="win">${k.first}</span>` : '–'}</td>
      <td class="n">${k.picked}</td>
    </tr>`).join('');

  const voterRows = j.voters.map(v => `
    <tr>
      <td>${v.voter}${v.codeOk === false
        ? ` <span class="sm" style="color:#c2410c">번호 불일치 ${v.code || '(빈칸)'}</span>` : ''}</td>
      <td class="sm">${new Date(v.at).toLocaleString('ko-KR')}</td>
      <td class="n"><button class="del" data-del="${v.voter}">지우기</button></td>
    </tr>`).join('');

  $('out').innerHTML = `
    <div class="bar">
      <button id="refresh">새로 불러오기</button>
      <span class="sm">${new Date().toLocaleTimeString('ko-KR')} 기준</span>
    </div>

    <div class="card">
      <h2>${j.round || '1차 투표'} · ${j.voters.length}명 참여</h2>
      <p>한 사람이 ${j.picks}개를 고릅니다. 고른 순서가 순위이고, 점수는 ${pts.join(' · ')}점입니다.<br>
        <b>표시된 상위 5종이 결선 후보입니다.</b> 결선은 환경변수에
        <code>SHORTLIST</code>와 <code>PICKS=1</code>을 넣으면 같은 주소로 열립니다.</p>
      <p style="margin-top:10px"><b>결선 후보 id</b>
        <code>${j.ranking.slice(0, 5).map(k => k.id).join(',')}</code></p>
    </div>

    <table>
      <thead><tr><th></th><th>디자인</th><th class="n">점수</th><th class="n">1순위</th><th class="n">득표</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>

    <div class="card" style="margin-top:22px">
      <h2>투표한 사람 ${j.voters.length}명${bad.length ? ` · 번호 불일치 ${bad.length}명` : ''}</h2>
      <p>잘못 들어간 표는 여기서 한 건씩 지웁니다. 지운 사람은 다시 투표할 수 있습니다.</p>
      ${j.voters.length ? `<table style="margin-top:12px">
        <thead><tr><th>이름</th><th>시각</th><th></th></tr></thead>
        <tbody>${voterRows}</tbody></table>` : '<p style="margin-top:10px">아직 없습니다.</p>'}
    </div>

    <div class="card">
      <h2>마감 시각</h2>
      <p>이 시각이 지나면 투표가 자동으로 닫히고, 메인 화면에 「마감되었습니다」가 뜹니다.
         바꾸면 바로 적용됩니다 (재배포 없음).</p>
      <div class="row">
        <input id="dl" type="datetime-local" step="60">
        <button id="saveDl" class="save">저장</button>
        <span class="ok" id="dlMsg"></span>
      </div>
      <p style="margin-top:10px">현재 설정: <code id="dlNow"></code></p>
    </div>

    <div class="card danger">
      <h2>전체 비우기</h2>
      <p>투표를 전부 지웁니다. <b>되돌릴 수 없습니다.</b>
         결선을 새로 시작할 때만 쓰세요. 한 건만 지울 거면 위에서 하시면 됩니다.</p>
      <div class="row">
        <input id="confirmText" placeholder="전체삭제 라고 입력">
        <button id="wipe" disabled>전부 지우기</button>
        <span class="ok" id="wipeMsg"></span>
      </div>
    </div>`;

  // 마감 시각 — datetime-local은 지역시간 문자열이라 오프셋을 직접 붙인다
  const pad = n => String(n).padStart(2, '0');
  const toLocal = iso => {
    const d = new Date(iso);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` +
           `T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  if (j.deadline) {
    $('dl').value = toLocal(j.deadline);
    $('dlNow').textContent = new Date(j.deadline).toLocaleString('ko-KR') +
      (Date.now() >= Date.parse(j.deadline) ? '  (지났습니다)' : '');
  }
  $('saveDl').addEventListener('click', async () => {
    const v = $('dl').value;
    if (!v) return;
    const d = new Date(v);                 // 브라우저 지역시간으로 해석된다
    $('saveDl').disabled = true;
    try {
      await api('/api/admin/deadline', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ deadline: d.toISOString() }),
      });
      $('dlMsg').textContent = '저장했습니다.';
      await load();
    } catch (e) { alert(e.message); }
    finally { $('saveDl').disabled = false; }
  });

  $('refresh').addEventListener('click', load);
  $('out').querySelectorAll('[data-del]').forEach(b => {
    b.addEventListener('click', async () => {
      const who = b.dataset.del;
      if (!confirm(`${who} 님의 표를 지울까요? 되돌릴 수 없습니다.`)) return;
      b.disabled = true;
      try {
        await api('/api/admin/delete', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ voter: who }),
        });
        await load();
      } catch (e) { alert(e.message); b.disabled = false; }
    });
  });
  $('confirmText').addEventListener('input', e => {
    $('wipe').disabled = e.target.value.trim() !== '전체삭제';
  });
  $('wipe').addEventListener('click', async () => {
    $('wipe').disabled = true;
    try {
      const r = await api('/api/reset?confirm=yes', { method: 'POST' });
      $('wipeMsg').textContent = `${r.deleted}건을 지웠습니다.`;
      await load();
    } catch (e) { alert(e.message); }
  });
}

$('enter').addEventListener('click', enter);
$('k').addEventListener('keydown', e => { if (e.key === 'Enter') enter(); });
const saved = sessionStorage.getItem('kitKey');
if (saved) { $('k').value = saved; enter(); }
</script>
</body>
</html>
