<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2027 한울타리 FC 유니폼 투표</title>
<meta name="description" content="2027 시즌 유니폼을 회원 투표로 정합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=14">
</head>
<body>

<!-- 1. 이름 고르기 -->
<section id="start" class="screen on">
  <div class="wrap">
    <p class="eyebrow" id="roundTag">2027 시즌</p>
    <h1>한울타리 FC<br>유니폼 투표</h1>
    <p class="lead" id="intro">마음에 드는 디자인을 골라주세요.</p>

    <div id="timer" class="timer" hidden>
      <span class="tlabel">마감까지</span>
      <strong id="tval"></strong>
      <span class="tdate" id="tdate"></span>
    </div>

    <div class="field">
      <span>본인 이름을 골라주세요</span>
      <input id="q" type="search" autocomplete="off" placeholder="많으면 여기에 한 글자만 쳐보세요">
      <div id="names" class="names" role="listbox" aria-label="회원 명부"></div>
    </div>

    <div id="auth" class="auth" hidden>
      <label for="code">본인 확인 — 전화번호 뒷 4자리</label>
      <input id="code" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000">
      <p class="why">다른 분 이름으로 투표되는 걸 막기 위한 것입니다.</p>
    </div>

    <p id="startErr" class="err" hidden></p>
    <p id="picked" class="picked" hidden></p>
    <button id="go" class="primary" disabled>시작하기</button>
    <p class="note" id="statusNote">이미 투표하셨어도 다시 하시면 마지막 투표로 바뀝니다.</p>
    <a class="adminlink" href="/results.html">관리자</a>
  </div>
</section>

<!-- 2. 디자인 고르기 -->
<section id="choose" class="screen">
  <header class="bar">
    <div class="brand">2027 한울타리 FC</div>
    <div class="round" id="pickLabel">3개를 골라주세요</div>
    <div class="count" id="pickCount">0 / 3</div>
  </header>

  <div id="grid" class="grid"></div>

  <footer class="dock">
    <div class="slots" id="slots"></div>
    <button id="submit" class="primary" disabled>제출하기</button>
  </footer>
</section>

<!-- 2-1. 제출 직전 번호 다시 확인 -->
<div id="recheck" class="sheet" hidden>
  <div class="sheetbox">
    <h3>전화번호 뒷 4자리를 확인해 주세요</h3>
    <p id="reMsg">입력하신 번호가 명부와 다릅니다. 오타가 아닌지 봐주세요.</p>
    <input id="recode" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000">
    <button id="reSubmit" class="primary">이 번호로 제출하기</button>
    <button id="reForce" class="ghost">번호가 맞습니다. 그대로 제출</button>
    <button id="reCancel" class="plainlink">돌아가기</button>
  </div>
</div>

<!-- 3. 크게 보기 -->
<div id="zoom" class="zoom" hidden>
  <button class="zclose" id="zclose" aria-label="닫기">✕</button>
  <button class="znav zprev" id="zprev" aria-label="이전">‹</button>
  <img id="zimg" alt="">
  <button class="znav znext" id="znext" aria-label="다음">›</button>
  <div class="zbar">
    <strong id="zname"></strong>
    <button id="zpick" class="zpick">고르기</button>
  </div>
</div>

<!-- 4. 끝 -->
<section id="done" class="screen">
  <div class="wrap">
    <p class="eyebrow">제출 완료</p>
    <h2>고맙습니다</h2>
    <p class="lead" id="doneLead"></p>
    <div id="mylist" class="mylist"></div>
    <p id="doneMsg" class="note"></p>
    <button id="again" class="ghost">다시 고르기</button>
  </div>
</section>

<script src="/app.js?v=14"></script>
</body>
</html>
